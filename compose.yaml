services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: bidart-postgres
    environment:
      POSTGRES_DB: bidart_db
      POSTGRES_USER: bidart_app
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data: 